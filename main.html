<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="logo.png" />
    <title>TOOL JARINGAN FTTH</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
      /* ========================================================
       TEMA BARU: "MODERN SLATE" (Adem & Elegan di Mata)
       ======================================================== */
      :root {
        --bg-utama: #0f172a; /* Slate 900 */
        --bg-sidebar: rgba(30, 41, 59, 0.85); /* Transparan untuk efek kaca */
        --bg-hover: #334155; /* Slate 700 */

        --primary: #6366f1; /* Indigo 500 */
        --primary-hover: #4f46e5; /* Indigo 600 */

        --border: rgba(255, 255, 255, 0.08);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #38bdf8; /* Biru muda */
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100%;
        display: flex;
        overflow: hidden;
        font-family: "Poppins", sans-serif;
        background: var(--bg-utama);
        color: var(--text-primary);
      }

      /* SIDEBAR KIRI DENGAN EFEK KACA (GLASSMORPHISM) */
      .sidebar {
        width: 270px;
        background: var(--bg-sidebar);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 4px 0 30px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        flex-shrink: 0;
        z-index: 10;
        overflow-x: hidden;
      }

      .sidebar.collapsed {
        width: 80px;
      }

      .sidebar-header {
        padding: 24px 10px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: padding 0.3s ease;
      }
      .sidebar.collapsed .sidebar-header {
        justify-content: center;
        padding: 24px 0;
      }

      .sidebar-title {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.5px;
        background: linear-gradient(
          135deg,
          var(--accent) 0%,
          var(--primary) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        transition: opacity 0.2s ease;
        white-space: nowrap;
      }
      .sidebar.collapsed .sidebar-title {
        display: none;
      }

      .toggle-sidebar-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        color: var(--text-primary);
        font-size: 16px;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }
      .toggle-sidebar-btn:hover {
        background: var(--bg-hover);
        color: var(--accent);
        transform: scale(1.05);
      }

      .sidebar-nav {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px 14px;
        gap: 10px;
      }
      .sidebar.collapsed .sidebar-nav {
        align-items: center;
        padding: 20px 8px;
      }

      .sidebar-btn {
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid transparent;
        padding: 12px 16px;
        border-radius: 16px;
        cursor: pointer;
        text-align: left;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        gap: 12px;
        align-items: center;
        white-space: nowrap;
        overflow: hidden;
        width: 100%;
      }

      .sidebar-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
        transform: translateY(-2px) scale(1.02);
      }

      .sidebar-btn.active {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-hover) 100%
        );
        color: white;
        box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      }
      .sidebar-btn.active:hover {
        transform: translateY(-2px) scale(1.02);
      }

      .btn-exit {
        margin-top: auto;
        background: rgba(150, 7, 7, 0.39) !important;
        border: 1px solid rgba(179, 20, 20, 0.5) !important;
        color: #ffffff !important;
      }

      .btn-exit:hover {
        background: rgb(236, 10, 10) !important;
        color: #ffffff !important;
        box-shadow: 0 10px 25px rgba(226, 50, 50, 0.5) !important;
        transform: translateY(-2px) scale(1.02) !important;
      }

      .sidebar-copyright {
        font-size: 10px;
        color: var(--text-secondary);
        text-align: center;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        margin-top: 10px;
        opacity: 0.5;
        transition: opacity 0.3s ease;
        letter-spacing: 0.3px;
        white-space: nowrap;
      }

      .sidebar-copyright:hover {
        opacity: 0.9;
      }

      .sidebar.collapsed .sidebar-btn {
        padding: 12px;
        width: 46px;
        height: 46px;
        justify-content: center;
        margin-bottom: 4px;
        border-radius: 14px;
      }
      .sidebar.collapsed .sidebar-btn:hover {
        transform: scale(1.1);
      }

      .sidebar.collapsed .sidebar-copyright {
        display: none;
      }

      .sidebar-icon {
        font-size: 20px;
        min-width: 20px;
        text-align: center;
      }
      .sidebar.collapsed .sidebar-text {
        display: none;
      }

      .content-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        transition: width 0.4s ease;
        background: var(--bg-utama);
        border-top-left-radius: 20px;
        border-bottom-left-radius: 20px;
        overflow: hidden;
      }
      /* CSS untuk tombol yang dinonaktifkan sementara */
      .sidebar-btn.disabled-btn {
        opacity: 0.4; /* Membuat tombol terlihat pudar */
        cursor: not-allowed; /* Mengubah kursor saat diarahkan */
        pointer-events: none; /* Mematikan interaksi klik dan hover */
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
      }

      @media (max-width: 768px) {
        html, body { flex-direction: column; }
        .content-area { border-radius: 0; }
        .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); height: auto; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
        .sidebar.collapsed { height: 75px; width: 100%; }
        .sidebar.collapsed .sidebar-nav { display: none; }
        .sidebar.collapsed .sidebar-title { display: block; }
        .sidebar.collapsed .sidebar-header { justify-content: space-between; padding: 16px 20px; border-bottom: none; }
        .sidebar-copyright { display: none; }
      }
    </style>
  </head>

  <body>
    <aside class="sidebar" id="mainSidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">JARINGAN FTTH PRO+</h2>
        <button id="toggleSidebarBtn" class="toggle-sidebar-btn" title="Minimize/Maximize Sidebar">☰</button>
      </div>

      <div class="sidebar-nav">
        <button class="sidebar-btn active" onclick="gantiHalaman('dashboard.html', this)" title="Dashboard">
          <i class="ph ph-squares-four sidebar-icon"></i>
          <span class="sidebar-text">Dashboard</span>
        </button>

        <button class="sidebar-btn" onclick="gantiHalaman('intersect.html', this)" title="KML Intersect">
          <i class="ph ph-intersect sidebar-icon"></i>
          <span class="sidebar-text">KML Intersect</span>
        </button>

        <button class="sidebar-btn" onclick="gantiHalaman('kmltohpdb.html?v=2', this)" title="KML to HPDB">
          <i class="ph ph-database sidebar-icon"></i>
          <span class="sidebar-text">KML to HPDB</span>
        </button>

        <button class="sidebar-btn" onclick="gantiHalaman('kmltoboq.html', this)" title="Konvert KML to BOQ">
          <i class="ph ph-chart-bar sidebar-icon"></i>
          <span class="sidebar-text">KML to BOQ</span>
        </button>

        <button class="sidebar-btn" onclick="gantiHalaman('konvert.html', this)" title="Konvert KML ↔ Excel">
          <i class="ph ph-arrows-left-right sidebar-icon"></i>
          <span class="sidebar-text">KML ↔ Excel</span>
        </button>

        <button class="sidebar-btn" onclick="gantiHalaman('diskripsikabel.html', this)" title="Diskripsi Kabel">
          <i class="ph ph-share-network sidebar-icon"></i>
          <span class="sidebar-text">Diskripsi Kabel</span>
        </button>

        <button class="sidebar-btn" onclick="gantiHalaman('gabungrumah.html', this)" title="Gabung Titik KML Rumah">
          <i class="ph ph-house-line sidebar-icon"></i>
          <span class="sidebar-text">Gabung Rumah</span>
        </button>

        <button class="sidebar-btn " onclick="gantiHalaman('tagginghomepass.html', this)" title="Tagging Homepass"> <!-- x-disabled-btn : mati, disabled-btn : nyala  -->
          <i class="ph ph-map-pin sidebar-icon"></i>
          <span class="sidebar-text">Tagging Homepass</span>
        </button>

        <button class="sidebar-btn disabled-btn" onclick="gantiHalaman('autonaming.html', this)" title="Auto Naming Master (ODP & Pole)" disabled> <!-- x-disabled-btn : mati, disabled-btn : nyala  -->
          <i class="ph ph-tag sidebar-icon"></i>
          <span class="sidebar-text">Autonaming</span>
        </button>

        <div style="height: 1px; background: rgba(255, 255, 255, 0.05); margin: 8px 0; border-radius: 2px;"></div>

        <button class="sidebar-btn btn-exit" onclick="logout()" title="Keluar dari Sistem">
          <i class="ph ph-sign-out sidebar-icon"></i>
          <span class="sidebar-text">Keluar</span>
        </button>

        <div class="sidebar-copyright">© 2025 FTTH PRO+ By. AYOGS</div>
      </div>
    </aside>

    <div class="content-area">
      <iframe id="layarUtama" src="dashboard.html"></iframe>
    </div>

    <script>
      // 1. LOGIKA MINIMIZE SIDEBAR
      const mainSidebar = document.getElementById("mainSidebar");
      const toggleSidebarBtn = document.getElementById("toggleSidebarBtn");

      toggleSidebarBtn.addEventListener("click", () => {
        mainSidebar.classList.toggle("collapsed");
      });

      // 2. LOGIKA GANTI HALAMAN IFRAME
      function gantiHalaman(namaFile, elemenTombol) {
        document.getElementById("layarUtama").src = namaFile;

        let tombol = document.querySelectorAll(".sidebar-btn");
        tombol.forEach((btn) => {
          btn.classList.remove("active");
        });

        elemenTombol.classList.add("active");

        // Jika dibuka di HP, otomatis tutup menu saat pindah halaman
        if (window.innerWidth <= 768) {
          mainSidebar.classList.add("collapsed");
        }
      }
    </script>
    <script>
      function logout() {
        sessionStorage.removeItem("isLoggedIn");
        window.location.href = "index.html";
      }
      // Cek apakah ada tanda 'isLoggedIn' di sessionStorage
      if (sessionStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "index.html";
      }
    </script>
    
    <!-- SCRIPT BLOKIR INSPECT ELEMENT & KLIK KANAN (TERMASUK IFRAME) -->
    <script>
      // 1. Blokir di halaman utama (main.html)
      function terapkanBlokir(targetWindow) {
        targetWindow.document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
        });

        targetWindow.document.addEventListener('keydown', function(e) {
          if (e.keyCode === 123 || // F12
             (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || // Ctrl+Shift+I/J/C
             (e.ctrlKey && e.keyCode === 85)) { // Ctrl+U
            e.preventDefault();
            return false;
          }
        });
      }

      // Terapkan untuk main.html
      terapkanBlokir(window);

      // 2. Terapkan otomatis ke dalam iframe setiap kali iframe dimuat
      const iframeLayarUtama = document.getElementById('layarUtama');
      iframeLayarUtama.onload = function() {
        try {
          terapkanBlokir(iframeLayarUtama.contentWindow);
        } catch (error) {
          console.log("Tidak bisa menyuntikkan script ke iframe (biasanya karena masalah Cross-Origin)");
        }
      };
    </script>
  </body>
</html>
