<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabung Titik KML</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            /* Warna background gelap seperti gambar */
            background-color: #0f1523; 
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card { 
            /* Warna kotak dalam gelap */
            background-color: #1e2433; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            text-align: center;
            max-width: 550px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 { 
            margin-top: 0; 
            /* Warna biru terang untuk judul */
            color: #38bdf8; 
            font-size: 24px;
            margin-bottom: 10px;
        }
        p { 
            color: #94a3b8; 
            font-size: 14px; 
            margin-bottom: 25px; 
        }
        .file-input-wrapper {
            margin: 20px 0;
            padding: 25px 15px;
            /* Garis putus-putus */
            border: 2px dashed #475569;
            border-radius: 8px;
            background-color: rgba(0,0,0,0.2);
            text-align: left;
        }
        .file-input-wrapper label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
        }
        input[type="file"] { 
            width: 100%; 
            color: #94a3b8;
            font-size: 14px;
        }
        /* Styling untuk tombol "Choose File" bawaan browser */
        input[type="file"]::file-selector-button {
            background-color: #f8fafc;
            color: #0f1523;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 600;
            margin-right: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #cbd5e1;
        }
        .btn-process { 
            /* Warna ungu dari gambar */
            background-color: #6366f1; 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            font-size: 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.3s ease;
            width: 100%;
            font-weight: 600;
            margin-top: 10px;
        }
        .btn-process:hover { 
            background-color: #4f46e5; 
        }
        #status { 
            margin-top: 20px; 
            font-size: 14px; 
            font-weight: 600; 
        }
        #download-btn { 
            display: none; 
            margin-top: 15px; 
            background-color: #10b981; 
            text-decoration: none; 
            color: white; 
            padding: 12px 24px; 
            border-radius: 8px; 
            font-weight: bold;
            transition: background 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }
        #download-btn:hover { 
            background-color: #059669; 
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Gabung Titik KML</h2>
        <p>Pilih beberapa file <b>.kml</b> sekaligus untuk digabungkan menjadi satu file.</p>

        <div class="file-input-wrapper">
            <label>1. Unggah File KML (Seluruh Line)</label>
            <input type="file" id="file-input" accept=".kml" multiple>
        </div>

        <button class="btn-process" onclick="mergeKMLFiles()">Proses Semua Line & Download</button>

        <div id="status"></div>
        <a id="download-btn">⬇️ Unduh File KML Gabungan</a>
    </div>

    <script>
        async function mergeKMLFiles() {
            const fileInput = document.getElementById('file-input');
            const status = document.getElementById('status');
            const downloadBtn = document.getElementById('download-btn');

            if (fileInput.files.length === 0) {
                alert("Silakan pilih minimal 1 file KML terlebih dahulu!");
                return;
            }

            status.style.color = "#fbbf24"; // Kuning warning
            status.innerText = "Memproses " + fileInput.files.length + " file...";
            downloadBtn.style.display = "none";

            let mergedPlacemarks = "";
            let totalPoints = 0;
            let errorCount = 0;

            const parser = new DOMParser();

            for (let i = 0; i < fileInput.files.length; i++) {
                const file = fileInput.files[i];
                try {
                    const text = await file.text();
                    const xmlDoc = parser.parseFromString(text, "text/xml");
                    
                    const placemarks = xmlDoc.getElementsByTagName("Placemark");

                    for(let j = 0; j < placemarks.length; j++) {
                        mergedPlacemarks += placemarks[j].outerHTML + "\n";
                        totalPoints++;
                    }
                } catch (error) {
                    console.error("Gagal membaca file: " + file.name, error);
                    errorCount++;
                }
            }

            if (totalPoints === 0) {
                status.style.color = "#ef4444"; // Merah error
                status.innerText = "Gagal. Tidak ada titik (Placemark) yang ditemukan.";
                return;
            }

            const kmlHeader = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n  <Document>\n    <name>Titik_Rumah_Gabungan</name>\n`;
            const kmlFooter = `  </Document>\n</kml>`;
            const finalKMLString = kmlHeader + mergedPlacemarks + kmlFooter;

            const blob = new Blob([finalKMLString], { type: "application/vnd.google-earth.kml+xml" });
            const url = URL.createObjectURL(blob);

            status.style.color = "#10b981"; // Hijau sukses
            let pesan = `Berhasil menggabungkan ${totalPoints} titik dari ${fileInput.files.length} file!`;
            if (errorCount > 0) pesan += ` (${errorCount} file gagal diproses)`;
            status.innerText = pesan;

            downloadBtn.href = url;
            downloadBtn.download = "KML_Gabungan.kml";
            downloadBtn.style.display = "inline-block";

            // ========================================================
            // PENAMBAHAN KODE: Kirim sinyal sukses ke server (Dashboard)
            // ========================================================
            fetch("update_counter.php", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ fitur: "counter_gabung" })
            })
            .then(response => response.json())
            .then(data => console.log("Counter Gabung Rumah berhasil ditambah!", data))
            .catch(error => console.error("Gagal mengirim counter:", error));
            // ========================================================
        
        }
    </script>

</body>
</html>
