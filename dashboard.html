<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Otomasi FTTH</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
      :root {
        --bg-utama: #0f172a; /* Slate 900 */
        --bg-card: #1e293b; /* Slate 800 */
        --border: rgba(255, 255, 255, 0.06);
        --primary: #6366f1; /* Indigo 500 */
        --primary-glow: rgba(99, 102, 241, 0.15);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --success: #10b981; /* Emerald 500 */
        --accent: #38bdf8; /* Sky 400 */
        --warning: #f59e0b; /* Amber 500 */
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: var(--bg-utama);
        color: var(--text-primary);
        padding: 30px;
        overflow-y: auto;
        height: 100vh;
      }

      /* Scrollbar Cantik & Minimalis */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-utama);
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }

      /* --- HEADER SECTION --- */
      .header-dashboard {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .welcome-text h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }

      .welcome-text p {
        color: var(--text-secondary);
        font-size: 14px;
        margin-top: 2px;
      }

      .date-badge {
        background: var(--bg-card);
        border: 1px solid var(--border);
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 13px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* --- BANNER DIENGKAP DI TENGAH --- */
      .banner-carousel {
        position: relative;
        border: 1px solid var(--border);
        border-radius: 16px;
        margin: 0 auto 30px auto;
        width: 100%;
        max-width: 800px;
        aspect-ratio: 16 / 9;
        overflow: hidden;
      }

      .carousel-track {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .carousel-slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease-in-out;
      }

      .carousel-slide.active {
        opacity: 1;
        pointer-events: auto;
      }

      .carousel-slide img {
        width: 100%;
        height: 100%;
        object-fit: fill;
      }

      .carousel-dots {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        z-index: 10;
      }

      .dot {
        width: 6px;
        height: 6px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        transition: all 0.3s ease;
      }

      .dot.active {
        background: #ffffff;
        width: 16px;
        border-radius: 4px;
      }

      /* --- STATS GRID --- */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        padding: 24px;
        border-radius: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .stat-card:hover {
        transform: translateY(-4px);
        border-color: rgba(99, 102, 241, 0.3);
        box-shadow: 0 12px 24px -10px var(--primary-glow);
      }

      .stat-info p {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
      }
      .stat-info h2 {
        font-size: 28px;
        font-weight: 700;
        margin-top: 4px;
        letter-spacing: -1px;
      }
      .stat-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }

      .icon-kml {
        background: rgba(99, 102, 241, 0.1);
        color: var(--primary);
      }
      .icon-pole {
        background: rgba(56, 189, 248, 0.1);
        color: var(--accent);
      }
      .icon-boq {
        background: rgba(16, 185, 129, 0.1);
        color: var(--success);
      }
      /* WARNA BARU UNTUK KARTU HPDB */
      .icon-hpdb {
        background: rgba(245, 158, 11, 0.1);
        color: var(--warning);
      }
    </style>
  </head>
  <body>
    <div class="header-dashboard">
      <div class="welcome-text">
        <h1>Selamat Datang Kembali di Jaringan FTTH 👋</h1>
        <p>
          Berikut adalah ringkasan otomatisasi data infrastruktur FTTH Anda hari
          ini.
        </p>
      </div>
      <div class="date-badge">
        <i class="ph ph-calendar-blank"></i>
        <span id="liveDate">Memuat tanggal...</span>
      </div>
    </div>

    <div class="banner-carousel">
      <div class="carousel-track">
        <div class="carousel-slide active">
          <img src="asset/1.png" alt="Banner 1" />
        </div>
        <div class="carousel-slide">
          <img src="asset/2.png" alt="Banner 2" />
        </div>
        <div class="carousel-slide">
          <img src="asset/3.png" alt="Banner 3" />
        </div>
        <div class="carousel-slide">
          <img src="asset/4.png" alt="Banner 4" />
        </div>
        <div class="carousel-slide">
          <img src="asset/5.png" alt="Banner 5" />
        </div>
      </div>

      <div class="carousel-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-info">
          <p>KML Intersect Dijalankan</p>
          <h2 id="fiturIntersect">0</h2>
        </div>
        <div class="stat-icon icon-kml"><i class="ph ph-file-code"></i></div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <p>KML ↔ Excel Dijalankan</p>
          <h2 id="fiturKonvert">0</h2>
        </div>
        <div class="stat-icon icon-pole"><i class="ph ph-barricade"></i></div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <p>KML to BOQ Sukses</p>
          <h2 id="fiturBoq">0</h2>
        </div>
        <div class="stat-icon icon-boq">
          <i class="ph ph-microsoft-excel-logo"></i>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <p>KML to HPDB Sukses</p>
          <h2 id="fiturHpdb">0</h2>
        </div>
        <div class="stat-icon icon-hpdb">
          <i class="ph ph-database"></i>
        </div>
      </div>
    </div>

    <script>
      // 1. TANGGAL OTOMATIS (Mendapatkan Hari Ini)
      const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      };
      document.getElementById("liveDate").innerText =
        new Date().toLocaleDateString("id-ID", options);

      // 2. LOGIKA CAROUSEL AUTO-SLIDE GAMBAR (Setiap 5 Detik)
      let currentSlide = 0;
      const slides = document.querySelectorAll(".carousel-slide");
      const dots = document.querySelectorAll(".dot");

      function gantiSlideOtomatis() {
        slides[currentSlide].classList.remove("active");
        dots[currentSlide].classList.remove("active");
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add("active");
        dots[currentSlide].classList.add("active");
      }
      setInterval(gantiSlideOtomatis, 5000);

      // 3. FUNGSI AMBIL DATA TERPUSAT DARI SERVER PHP
      function loadStatistikAktivitas() {
        fetch("update_counter.php")
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("fiturIntersect").innerText =
              data.counter_intersect || 0;
            document.getElementById("fiturKonvert").innerText =
              data.counter_konvert || 0;
            document.getElementById("fiturBoq").innerText =
              data.counter_boq || 0;
            // UPDATE: Membaca data counter_hpdb dari PHP
            document.getElementById("fiturHpdb").innerText =
              data.counter_hpdb || 0;
          })
          .catch((err) =>
            console.error("Gagal mengambil data statistik server:", err),
          );
      }

      // Jalankan setiap kali halaman dashboard dibuka
      document.addEventListener("DOMContentLoaded", loadStatistikAktivitas);
    </script>
    <script>
      // Cek apakah ada tanda 'isLoggedIn' di sessionStorage
      if (sessionStorage.getItem("isLoggedIn") !== "true") {
        // Jika tidak ada, paksa pindah ke halaman login
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
